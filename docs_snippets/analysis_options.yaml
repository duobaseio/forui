include: package:flint/analysis_options.flutter.yaml
analyzer:
  errors:
    diagnostic_describe_all_properties: ignore
    implicit_call_tearoffs: ignore
    invalid_annotation_target: ignore # We disable this lint because we use @override extensively in our code snippets.
    public_member_api_docs: ignore
    unnecessary_type_name_in_constructor: ignore # AutoRouter doesn't support the new 3.13 constructor syntax yet.
    unused_result: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**