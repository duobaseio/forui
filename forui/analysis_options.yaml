include: package:flint/analysis_options.flutter.yaml
analyzer:
  errors:
    prefer_asserts_with_message: ignore
    # TODO: https://github.com/dart-lang/sdk/issues/64920.
    # At this point it's a meme lol. It has never been enabled because something keeps breaking every release.
    unused_result: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - use_key_in_widget_constructors
