include: package:flint/analysis_options.flutter.yaml
analyzer:
  errors:
    prefer_asserts_with_message: ignore
    public_member_api_docs: ignore # TODO: https://github.com/dart-lang/sdk/issues/64043
    unused_result: ignore # TODO: Re-enable once Dart 3.13 lands
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - use_key_in_widget_constructors
