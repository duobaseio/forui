include: package:flint/analysis_options.flutter.yaml
analyzer:
  errors:
    prefer_asserts_with_message: ignore
    unnecessary_null_checks: ignore
    unused_result: ignore # Re-enable once Dart 3.13 lands
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - use_key_in_widget_constructors
